force_keyboard_focus = true # forces keyboard focus to stay in Walker
selection_wrap = true       # wrap list if at bottom or top
theme = "everforest"        # ~/.config/walker/themes/everforest
hide_action_hints = true    # globally hide the action hints

[placeholders]
"default" = { input = "  Search…", list = "No results" }

[keybinds]
quick_activate = []

[columns]
symbols = 1

[providers]
max_results = 256

# Type freely: applications are fuzzy-matched, and websearch contributes a
# single row that ranks below any real app match. When nothing matches, that
# row is all that is left — so Return sends the raw query to the default
# browser. Walker has no explicit "only if zero results" hook; this is the
# ranking doing the work.
default = [ "desktopapplications", "websearch" ]

# An empty prompt should list applications, not offer to search for nothing.
empty = [ "desktopapplications" ]

[providers.max_results_provider]
# One search row, never a block of them. This is what keeps websearch feeling
# like a fallback rather than a provider competing for space.
websearch = 1

[[providers.prefixes]]
prefix = "/"
provider = "providerlist"

[[providers.prefixes]]
prefix = "."
provider = "files"

[[providers.prefixes]]
prefix = ":"
provider = "symbols"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

[[providers.prefixes]]
prefix = "$"
provider = "clipboard"

# No [[emergencies]] block. The omarchy config had one calling
# `omarchy-restart-walker`, which does not exist here. Elephant now runs as a
# real user unit, so `systemctl --user restart elephant` is the recovery path.
