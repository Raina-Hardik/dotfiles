force_keyboard_focus = true # forces keyboard focus to stay in Walker
selection_wrap = true       # wrap list if at bottom or top
theme = "everforest"        # ~/.config/walker/themes/everforest
hide_action_hints = true    # globally hide the action hints

[placeholders]
"default" = { input = "  Search…", list = "No results" }

[keybinds]
quick_activate = []

[columns]
symbols = 1

[providers]
max_results = 256

# Apps only. websearch used to sit here too, so every keystroke interleaved
# search-engine rows with real applications — that was most of the clutter.
# It is still one keystroke away behind the `@` prefix below.
default = [ "desktopapplications" ]

[[providers.prefixes]]
prefix = "/"
provider = "providerlist"

[[providers.prefixes]]
prefix = "."
provider = "files"

[[providers.prefixes]]
prefix = ":"
provider = "symbols"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

[[providers.prefixes]]
prefix = "$"
provider = "clipboard"

# No [[emergencies]] block. The omarchy config had one calling
# `omarchy-restart-walker`, which does not exist here. There is no walker or
# elephant systemd user unit on this system either — walker spawns elephant
# itself — so there is nothing honest to put in its place.
